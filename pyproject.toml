[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "mylibdeguchi"
version = "0.1.0"
description = "My first Python library"
license = { file = "LICENSE" }
authors = [
    { name = "Shota Deguchi", email = "shotadeguchio2o5@gmail.com" },
]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.8.0",
    "numpy>=2.2.6",
]

[tool.setuptools.packages.find]
where = ["src"]